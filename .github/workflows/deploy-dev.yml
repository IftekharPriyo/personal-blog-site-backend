name: Deploy backend dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_BACKEND_DIR: ${{ secrets.EC2_BACKEND_DIR }}
          PM2_BACKEND_NAME: ${{ secrets.PM2_BACKEND_NAME }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

          ssh -i ~/.ssh/ec2_deploy_key \
            -p "$EC2_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" \
            "EC2_BACKEND_DIR='$EC2_BACKEND_DIR' PM2_BACKEND_NAME='$PM2_BACKEND_NAME' bash -s" <<'EOF'
          set -euo pipefail
          export CI=true

          APP_DIR="${EC2_BACKEND_DIR:-$HOME/personal-blog-site-backend}"
          PM2_NAME="${PM2_BACKEND_NAME:-personal-blog-site-backend}"

          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
          fi

          cd "$APP_DIR"

          git fetch origin dev
          git checkout dev
          git pull --ff-only origin dev

          corepack enable
          corepack prepare pnpm@10.29.3 --activate

          pnpm install --frozen-lockfile
          pnpm prisma generate
          pnpm prisma migrate deploy

          pm2 restart "$PM2_NAME" --update-env
          pm2 save
          EOF
